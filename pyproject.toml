[project]
name = "peupleraie"
version = "0.1.0"
description = "Comparateur des ventes DVF d'appartements au Domaine de la Peupleraie (Fresnes)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2"]

[project.scripts]
peupleraie = "peupleraie.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peupleraie"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
